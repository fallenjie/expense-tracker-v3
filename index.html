<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>记账本 V3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --accent:#007AFF;--accent-light:#dbeafe;--accent-dark:#0050b3;--accent-bright:#007AFF;
  --accent-pale:#dbeafe;
  --accent:#007AFF;--accent-light:#dbeafe;--accent-dark:#0050b3;--accent-bright:#4da3ff;
  --accent-pale:#e8f0fd;
  --yellow:#F59E0B;--yellow-light:#FEF3C7;--yellow-dark:#D97706;
  --orange:#F97316;--orange-light:#FFF7ED;
  --red:#EF4444;--red-light:#FEE2E2;--red-dark:#DC2626;
  --blue:#3B82F6;--blue-light:#DBEAFE;
  --purple:#8B5CF6;--purple-light:#EDE9FE;
  --bg:#e8f0fd;
  --card:#FFFFFF;--card-glass:rgba(255,255,255,.78);
  --text:#0F172A;--text-secondary:#334155;--sub:#64748B;--muted:#94A3B8;
  --border:#E2E8F0;--border-light:#F1F5F9;--divider:rgba(0,0,0,.05);
  --shadow-xs:0 1px 2px rgba(0,0,0,.025);
  --shadow-sm:0 2px 6px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.03);
  --shadow:0 4px 14px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --shadow-md:0 8px 28px rgba(0,0,0,.09),0 2px 6px rgba(0,0,0,.04);
  --shadow-lg:0 16px 48px rgba(0,0,0,.14),0 4px 12px rgba(0,0,0,.06);
  --shadow-glow-accent:0 4px 20px rgba(0,122,255,.28);
  --shadow-glow-red:0 4px 20px rgba(239,68,68,.22);
  --radius:16px;--radius-sm:12px;--radius-lg:22px;--radius-xl:28px;--radius-full:9999px;
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 0%,#dbeafe 0%,transparent 50%),
    radial-gradient(ellipse at 80% 100%,#dbeafe 0%,transparent 50%);
  background-attachment:fixed;
  color:var(--text);max-width:430px;margin:0 auto;min-height:100vh;
  padding-bottom:80px;user-select:none;-webkit-font-smoothing:antialiased;
  position:relative;
}
body::before{
  content:'';position:fixed;inset:0;max-width:430px;margin:0 auto;pointer-events:none;z-index:-1;
  opacity:.35;
  background-image:
    linear-gradient(0deg,transparent 0%,transparent 39px,rgba(0,0,0,.007) 39px,rgba(0,0,0,.007) 40px),
    linear-gradient(90deg,transparent 0%,transparent 39px,rgba(0,0,0,.003) 39px,rgba(0,0,0,.003) 40px);
  background-size:40px 40px;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeModal{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes popIn{0%{opacity:0;transform:scale(.85)}60%{transform:scale(1.03)}100%{opacity:1;transform:scale(1)}}
.app{display:none}.app.active{display:block}
.page{display:none;padding:14px 16px;animation:fadeInUp .3s cubic-bezier(.16,1,.3,1)}
.page.active{display:block}
.tab-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid rgba(0,0,0,.05);display:flex;z-index:100;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom,0));
  box-shadow:0 -8px 36px rgba(0,0,0,.08),0 -1px 0 rgba(0,0,0,.03);
  border-radius:22px 22px 0 0;
}
.tab-btn{flex:1;text-align:center;padding:6px 0;cursor:pointer;color:var(--muted);font-size:10px;font-weight:600;transition:all .25s cubic-bezier(.16,1,.3,1);position:relative}
.tab-btn .ic{font-size:22px;display:block;margin-bottom:3px;transition:all .3s cubic-bezier(.34,1.56,.64,1);filter:grayscale(.5) opacity(.55)}
.tab-btn.active{color:var(--accent)}
.tab-btn.active .ic{filter:none;transform:scale(1.14)}
.tab-btn.active::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:22px;height:4px;border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));box-shadow:0 2px 10px rgba(0,122,255,.4)}
.tab-btn:active{transform:scale(.9)}
.card{background:var(--card-glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.5);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(145deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 55%);border-radius:inherit;z-index:0}
.card>*{position:relative;z-index:1}
.bd-card{background:var(--card-glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.5)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-title{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.sc-row{display:flex;gap:10px;margin-bottom:14px}
.sc{flex:1;background:var(--card-glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:var(--radius-lg);padding:16px 14px;box-shadow:var(--shadow-sm);border:1px solid rgba(255,255,255,.5);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.sc:active{transform:scale(.96)}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:4px 4px 0 0}
.sc.inc::before{background:linear-gradient(90deg,var(--accent),var(--accent-bright))}
.sc.exp::before{background:linear-gradient(90deg,#F87171,var(--red))}
.sc.bal::before{background:linear-gradient(90deg,var(--yellow),var(--orange))}
.sc-lbl{font-size:10px;color:var(--muted);margin-bottom:6px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.sc-val{font-size:21px;font-weight:800;letter-spacing:-.5px}
.sc-val.inc{color:var(--accent)}.sc-val.exp{color:var(--red)}
.bd-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-bottom:10px;font-weight:600}
.bd-bar{height:10px;background:rgba(0,0,0,.06);border-radius:10px;overflow:hidden;margin-bottom:8px;box-shadow:inset 0 1px 3px rgba(0,0,0,.04)}
.bd-fill{height:100%;border-radius:10px;transition:width .6s cubic-bezier(.16,1,.3,1),background .3s;background-image:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.35) 50%,transparent 100%);background-size:200% 100%;animation:shimmer 2.5s ease-in-out infinite}
.bd-pct{font-size:13px;font-weight:700;text-align:right}
.rec-row{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--divider);cursor:pointer;transition:background .15s;border-radius:12px;padding-left:10px;padding-right:10px;margin:0 -10px}
.rec-row:last-child{border-bottom:none}.rec-row:hover{background:rgba(0,122,255,.03)}.rec-row:active{background:rgba(0,122,255,.06);transform:scale(.99)}
.rec-ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;margin-right:12px;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.07);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.rec-row:hover .rec-ic{transform:scale(1.08)}
.rec-mid{flex:1;min-width:0}.rec-mid .cat{font-size:15px;font-weight:700;margin-bottom:3px;letter-spacing:-.2px}.rec-mid .sub{font-size:11px;color:var(--sub)}
.rec-right{text-align:right;flex-shrink:0;margin-left:10px}
.rec-amt{font-size:16px;font-weight:800;letter-spacing:-.3px}.rec-amt.inc{color:var(--accent)}.rec-amt.exp{color:var(--red)}
.rec-date{font-size:11px;color:var(--muted);margin-top:3px}
.rec-del{font-size:11px;color:var(--red);cursor:pointer;margin-top:4px;display:inline-block;padding:4px 10px;border-radius:8px;transition:all .2s}
.rec-del:hover{background:var(--red-light)}.rec-del:active{transform:scale(.92);opacity:.7}
.empty{text-align:center;padding:56px 24px;color:var(--sub)}
.empty .eicon{font-size:56px;margin-bottom:14px;display:inline-block;animation:float 3.5s ease-in-out infinite;filter:drop-shadow(0 6px 16px rgba(0,0,0,.08))}
.empty .etitle{font-size:15px;font-weight:700;color:var(--text-secondary);margin-bottom:6px;letter-spacing:-.2px}
.empty p{font-size:13px;line-height:1.7;color:var(--muted);max-width:240px;margin:0 auto}
.sbox{display:flex;gap:8px;margin-bottom:14px}
.sbox input{flex:1;padding:12px 16px;border:1px solid rgba(0,0,0,.08);border-radius:var(--radius);font-size:13px;outline:none;background:var(--card-glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:border-color .25s cubic-bezier(.16,1,.3,1),box-shadow .25s cubic-bezier(.16,1,.3,1),background .25s;box-shadow:var(--shadow-xs)}
.sbox input:focus{border-color:var(--accent);background:var(--accent-pale);box-shadow:0 0 0 4px rgba(0,122,255,.08)}
.f-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px;white-space:nowrap;scrollbar-width:none}
.f-row::-webkit-scrollbar{display:none}
.chip{padding:7px 15px;border-radius:var(--radius-full);font-size:12px;background:var(--card-glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;white-space:nowrap;border:1px solid rgba(0,0,0,.06);transition:all .25s cubic-bezier(.16,1,.3,1);font-weight:600;color:var(--text-secondary)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border-color:transparent;box-shadow:var(--shadow-glow-accent)}
.chip:active{transform:scale(.93)}
.sub-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;white-space:nowrap;scrollbar-width:none}
.sub-row::-webkit-scrollbar{display:none}
.schip{padding:7px 15px;border-radius:var(--radius-full);font-size:11px;background:var(--card-glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;white-space:nowrap;border:1px solid rgba(0,0,0,.06);transition:all .25s cubic-bezier(.16,1,.3,1);color:var(--text-secondary);font-weight:500}
.schip:hover{border-color:var(--accent);color:var(--accent)}
.schip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-pale);font-weight:700}
.schip:active{transform:scale(.93)}
.rpt-tog{display:flex;background:rgba(0,0,0,.04);border-radius:var(--radius);padding:4px;margin-bottom:16px;box-shadow:inset 0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.04)}
.tog-btn{flex:1;text-align:center;padding:10px;font-size:14px;border-radius:13px;cursor:pointer;color:var(--text-secondary);transition:all .3s cubic-bezier(.16,1,.3,1);font-weight:600}
.tog-btn:hover{color:var(--text)}.tog-btn.on{background:#fff;color:var(--accent);font-weight:700;box-shadow:var(--shadow-sm)}.tog-btn:active{transform:scale(.95)}
.pie-row{display:flex;gap:10px}
.pie-col{flex:1;background:var(--card-glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:var(--radius-lg);padding:16px 12px;text-align:center;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.5)}
.pie-lbl{font-size:12px;color:var(--text-secondary);margin-bottom:10px;font-weight:700;letter-spacing:-.2px}
.pie-can{width:120px;height:120px;border-radius:50%;margin:0 auto;position:relative;box-shadow:0 4px 20px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.05);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.pie-can:active{transform:scale(1.04)}
.pie-hole{position:absolute;inset:28px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;box-shadow:inset 0 2px 8px rgba(0,0,0,.05);letter-spacing:-.3px}
.pie-leg{font-size:10px;margin-top:10px;text-align:left;max-height:130px;overflow-y:auto;scrollbar-width:none;padding-right:2px}
.pie-leg::-webkit-scrollbar{display:none}
.leg-it{display:flex;align-items:center;gap:6px;padding:3px 0}
.leg-d{width:10px;height:10px;border-radius:4px;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.leg-n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:500}
.leg-v{color:var(--muted);flex-shrink:0;font-size:10px;font-weight:600}
.set-item{display:flex;align-items:center;justify-content:space-between;padding:14px 6px;border-bottom:1px solid var(--divider);cursor:pointer;transition:all .2s;border-radius:12px;padding-left:14px;padding-right:14px;margin:0 -8px}
.set-item:last-child{border-bottom:none}.set-item:hover{background:rgba(0,122,255,.03)}.set-item:active{background:rgba(0,122,255,.06)}
.si-l{display:flex;align-items:center;gap:12px}.si-ic{font-size:22px;width:28px;text-align:center}.si-tx{font-size:15px;font-weight:600;letter-spacing:-.2px}
.si-arr{color:var(--muted);font-size:20px;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}.set-item:active .si-arr{transform:translateX(4px)}
.acc-row{display:flex;align-items:center;padding:12px 4px;border-bottom:1px solid var(--divider);transition:background .15s;border-radius:12px}
.acc-row:last-child{border-bottom:none}
.acc-ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;margin-right:12px;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.07)}
.acc-mid{flex:1}.acc-name{font-size:15px;font-weight:700;margin-bottom:3px;letter-spacing:-.2px}.acc-bal{font-size:11px;color:var(--sub)}
.acc-ed,.acc-dl{font-size:12px;cursor:pointer;padding:6px 14px;font-weight:600;border-radius:10px;transition:all .2s;margin-left:4px}
.acc-ed{color:var(--accent);background:var(--accent-pale)}.acc-ed:hover{background:var(--accent);color:#fff}.acc-ed:active{transform:scale(.92)}
.acc-dl{color:var(--red);background:var(--red-light)}.acc-dl:hover{background:var(--red);color:#fff}.acc-dl:active{transform:scale(.92)}
.fab{
  position:fixed;bottom:84px;right:calc(50% - 193px);width:56px;height:56px;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:300;cursor:pointer;z-index:99;
  box-shadow:0 8px 30px rgba(0,122,255,.45),0 2px 8px rgba(0,122,255,.2);
  transition:all .25s cubic-bezier(.34,1.56,.64,1);border:none;
}
.fab:hover{transform:scale(1.06);box-shadow:0 10px 36px rgba(0,122,255,.5);border-radius:20px}
.fab:active{transform:scale(.85);box-shadow:0 4px 14px rgba(0,122,255,.35);border-radius:16px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:200;display:none;align-items:flex-end;justify-content:center;animation:fadeModal .3s cubic-bezier(.4,0,.2,1)}
.modal.show{display:flex}
.modal>div{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:430px;max-height:92vh;overflow-y:auto;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0));box-shadow:0 -12px 48px rgba(0,0,0,.18);animation:slideUp .4s cubic-bezier(.34,1.56,.64,1)}
.m-hd{text-align:center;font-size:18px;font-weight:800;margin-bottom:20px;position:relative;padding-bottom:14px;border-bottom:1px solid var(--divider);letter-spacing:-.3px}
.fg{margin-bottom:16px}
.fg>label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:7px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.fg>input,.fg>select{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:14px;outline:none;background:rgba(248,250,252,.8);color:var(--text);transition:border-color .25s cubic-bezier(.16,1,.3,1),box-shadow .25s cubic-bezier(.16,1,.3,1),background .25s;font-weight:500}
.fg>input:focus,.fg>select:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px rgba(0,122,255,.08)}
.ty-row{display:flex;background:rgba(0,0,0,.03);border-radius:var(--radius);padding:4px;margin-bottom:16px;gap:4px;box-shadow:inset 0 1px 3px rgba(0,0,0,.04)}
.ty-btn{flex:1;text-align:center;padding:11px;font-size:14px;border-radius:13px;cursor:pointer;color:var(--text-secondary);font-weight:700;transition:all .3s cubic-bezier(.16,1,.3,1)}
.ty-btn.ex-sel{background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;box-shadow:var(--shadow-glow-red)}
.ty-btn.in-sel{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;box-shadow:var(--shadow-glow-accent)}
.ty-btn:active{transform:scale(.94)}
.amt-wrap{display:flex;align-items:center;gap:8px}.amt-wrap input{font-size:24px;font-weight:800;letter-spacing:-.8px;padding:14px 16px}
.qbtns{display:flex;gap:5px;flex-shrink:0}
.qbtn{padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--card-glass);font-size:11px;cursor:pointer;font-weight:700;color:var(--text-secondary);transition:all .2s cubic-bezier(.16,1,.3,1);box-shadow:var(--shadow-xs)}
.qbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-pale)}.qbtn:active{transform:scale(.9);background:var(--accent);color:#fff;border-color:var(--accent)}
.cat-m{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:14px}
.ci{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;border:2px solid transparent;cursor:pointer;font-size:10px;gap:4px;background:var(--card-glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .25s cubic-bezier(.34,1.56,.64,1);font-weight:600;box-shadow:var(--shadow-xs)}
.ci:hover{transform:scale(1.04);border-color:var(--border);box-shadow:var(--shadow-sm)}
.ci.sel{border-color:var(--accent);background:var(--accent-pale);box-shadow:0 4px 16px rgba(0,122,255,.15);transform:scale(1.02)}
.ci .ci-ic{font-size:24px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}.ci.sel .ci-ic{transform:scale(1.18)}
.ci .ci-nm{font-size:10px;text-align:center;overflow:hidden;width:100%;white-space:nowrap;text-overflow:ellipsis;color:var(--text-secondary)}.ci.sel .ci-nm{color:var(--accent)}
.ci.add{background:transparent;color:var(--muted);border:2px dashed rgba(0,0,0,.1)}.ci.add:hover{background:var(--accent-pale);border-color:var(--accent);color:var(--accent)}.ci:active{transform:scale(.9)}
.recent-r{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;scrollbar-width:none}.recent-r::-webkit-scrollbar{display:none}
.rc-it{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 16px;border:1.5px solid rgba(0,0,0,.06);border-radius:14px;cursor:pointer;min-width:60px;flex-shrink:0;font-size:11px;font-weight:600;color:var(--text-secondary);background:var(--card-glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .25s cubic-bezier(.34,1.56,.64,1);box-shadow:var(--shadow-xs)}
.rc-it:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-sm);color:var(--accent)}.rc-it .rc-ic{font-size:22px;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}.rc-it:hover .rc-ic{transform:scale(1.15)}.rc-it:active{transform:scale(.9)}
.btn-save{width:100%;padding:15px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border:none;border-radius:15px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 22px rgba(0,122,255,.3);transition:all .25s cubic-bezier(.34,1.56,.64,1);letter-spacing:.3px;position:relative;overflow:hidden}
.btn-save::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,transparent 0%,rgba(255,255,255,.08) 50%,transparent 100%);background-size:200% 100%}
.btn-save:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,122,255,.4)}.btn-save:active{transform:scale(.96);box-shadow:0 3px 10px rgba(0,122,255,.2);opacity:.9}
.btn-save.danger{background:linear-gradient(135deg,var(--red),var(--red-dark));margin-top:10px;box-shadow:0 6px 22px rgba(239,68,68,.25)}.btn-save.danger:hover{box-shadow:0 8px 30px rgba(239,68,68,.35)}.btn-save.danger:active{box-shadow:0 3px 10px rgba(239,68,68,.15)}
.auth-wrap{padding:40px 20px;display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);background-image:radial-gradient(ellipse at 30% 10%,rgba(0,122,255,.08),transparent 50%),radial-gradient(ellipse at 70% 90%,rgba(59,130,246,.06),transparent 50%)}
.auth-box{background:var(--card);border-radius:28px;padding:40px 32px;width:100%;max-width:360px;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.5)}
.auth-logo{text-align:center;font-size:52px;margin-bottom:12px;display:block;animation:float 3s ease-in-out infinite}
.auth-tit{text-align:center;font-size:22px;font-weight:800;color:var(--accent);margin-bottom:32px;letter-spacing:-.3px}
.auth-box input{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:15px;font-size:15px;outline:none;margin-bottom:16px;background:rgba(248,250,252,.8);transition:border-color .25s cubic-bezier(.16,1,.3,1),box-shadow .25s cubic-bezier(.16,1,.3,1),background .25s;font-weight:500}
.auth-box input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px rgba(0,122,255,.08)}
.auth-btn{width:100%;padding:15px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border:none;border-radius:15px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 22px rgba(0,122,255,.3);transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.auth-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,122,255,.4)}.auth-btn:active{transform:scale(.96);opacity:.9}
.auth-link{text-align:center;margin-top:16px;font-size:14px;color:var(--accent);cursor:pointer;font-weight:600;transition:opacity .2s}.auth-link:hover{opacity:.8}.auth-link:active{opacity:.6}
.bd-form{display:flex;gap:8px;align-items:center}
.bd-form input{flex:1;padding:11px 14px;border:1.5px solid var(--border);border-radius:13px;font-size:13px;outline:none;background:rgba(248,250,252,.8);transition:border-color .25s cubic-bezier(.16,1,.3,1),box-shadow .25s cubic-bezier(.16,1,.3,1);font-weight:500}
.bd-form input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,122,255,.08)}
.bd-save{padding:11px 22px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border:none;border-radius:13px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,122,255,.28);transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.bd-save:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,122,255,.38)}.bd-save:active{transform:scale(.94)}
.date-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.dchip{padding:6px 14px;border-radius:var(--radius-full);font-size:12px;background:var(--card-glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;font-weight:600;color:var(--text-secondary);border:1px solid rgba(0,0,0,.06);transition:all .25s cubic-bezier(.16,1,.3,1);box-shadow:var(--shadow-xs)}
.dchip:hover{border-color:var(--accent);color:var(--accent)}.dchip.on{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;box-shadow:var(--shadow-glow-accent);border-color:transparent}.dchip:active{transform:scale(.92)}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-100px);background:rgba(15,23,42,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;padding:12px 22px;border-radius:var(--radius-full);font-size:13px;font-weight:600;z-index:300;pointer-events:none;transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .35s cubic-bezier(.16,1,.3,1);box-shadow:0 12px 40px rgba(0,0,0,.3);max-width:320px;text-align:center;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
::-webkit-scrollbar{width:0}
.rpt-nav{cursor:pointer;font-size:16px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;transition:all .2s cubic-bezier(.16,1,.3,1);font-weight:700;color:var(--text-secondary);background:var(--card-glass);backdrop-filter:blur(8px);box-shadow:var(--shadow-xs)}
.rpt-nav:hover{background:var(--accent-pale);color:var(--accent)}.rpt-nav:active{transform:scale(.88)}
.rpt-month{font-size:15px;font-weight:800;letter-spacing:-.3px;min-width:100px;text-align:center}
.sec-title{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;margin-top:4px}
@media(max-width:380px){.sc-row{gap:7px}.sc{padding:14px 10px}.sc-val{font-size:18px}.cat-m{gap:7px}.ci{border-radius:12px}.ci .ci-ic{font-size:20px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
var curU=null,curTab='home',editId=null,rptType='day',rptMonth='';
var fType='expense',fCat='',fDate='',fAcc='',fAmt='';
var bSearch='',bDate='',bCat=[],bAcc=[];
var editAcc=null;

function P(id){try{return document.getElementById(id)}catch(e){return null}}
function fmtM(){try{var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')}catch(e){return''}}
function fmtD(d){try{var x=new Date(d);return x.getFullYear()+'-'+(x.getMonth()+1).toString().padStart(2,'0')+'-'+x.getDate().toString().padStart(2,'0')}catch(e){return''}}
function fmtY(v){return (v||0).toFixed(2)}
function shiftMonth(ym,delta){var p=ym.split('-');var y=parseInt(p[0]),m=parseInt(p[1])+delta;while(m>12){y++;m-=12}while(m<1){y--;m+=12}return y+'-'+m.toString().padStart(2,'0')}
function uid(){try{return Date.now().toString(36)+Math.random().toString(36).substring(2,11)}catch(e){return Date.now().toString()}}
function es(s){try{return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}catch(e){return''}}
var _tt=null;
function toast(m){try{var t=P('toast');t.textContent=m;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('show')},2000)}catch(e){}}

function getItem(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function setItem(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function getUsers(){try{return getItem('et_users')||[]}catch(e){return[]}}
function setUsers(v){try{setItem('et_users',v)}catch(e){}}
function getRecords(){try{return getItem('et_records')||[]}catch(e){return[]}}
function saveRecord(r){try{var rs=getRecords();var i=rs.findIndex(function(x){return x.id===r.id});if(i>=0)rs[i]=r;else rs.unshift(r);setItem('et_records',rs)}catch(e){}}
function deleteRecord(id){try{var rs=getRecords();setItem('et_records',rs.filter(function(x){return x.id!==id}))}catch(e){}}
function getAccounts(){try{return getItem('et_accounts')||[]}catch(e){return[]}}
function saveAccount(a){try{var as=getAccounts();var i=as.findIndex(function(x){return x.id===a.id});if(i>=0)as[i]=a;else as.push(a);setItem('et_accounts',as)}catch(e){}}
function deleteAccount(id){try{var as=getAccounts();setItem('et_accounts',as.filter(function(x){return x.id!==id}))}catch(e){}}
function getCats(){try{return getItem('et_cats')||[]}catch(e){return[]}}
function saveCat(c){try{var cs=getCats();var i=cs.findIndex(function(x){return x.id===c.id});if(i>=0)cs[i]=c;else cs.push(c);setItem('et_cats',cs)}catch(e){}}
function deleteCat(id){try{var cs=getCats();setItem('et_cats',cs.filter(function(x){return x.id!==id}))}catch(e){}}
function getBudget(){try{return getItem('et_budget')||[]}catch(e){return[]}}
function saveBudget(b){try{var bs=getBudget();var i=bs.findIndex(function(x){return x.user===b.user});if(i>=0)bs[i]=b;else bs.push(b);setItem('et_budget',bs)}catch(e){}}
function getAlerted(){try{return getItem('et_alerted')||{}}catch(e){return{}}}
function setAlerted(m){try{var a=getAlerted();a[m]=true;setItem('et_alerted',a)}catch(e){}}
function getLastUsed(){try{return getItem('et_lastUsed')||[]}catch(e){return[]}}
function setLastUsed(cid){try{var lu=getLastUsed();lu=lu.filter(function(x){return x!==cid});lu.unshift(cid);if(lu.length>3)lu.pop();setItem('et_lastUsed',lu)}catch(e){}}
function getLastCombo(){try{return getItem('et_lastCombo')||null}catch(e){return null}}
function setLastCombo(c){try{setItem('et_lastCombo',c)}catch(e){}}
function catById(id){try{return getCats().find(function(c){return c.id===id})}catch(e){return null}}
function accById(id){try{return getAccounts().find(function(a){return a.id===id})}catch(e){return null}}
function myRecs(){try{return getRecords().filter(function(r){return r.user===curU.id})}catch(e){return[]}}
function accBal(accId){try{var rs=getRecords().filter(function(r){return r.user===curU.id&&r.account===accId});var inc=rs.filter(function(r){return r.type==='income'}).reduce(function(s,r){return s+Number(r.amount)},0);var exp=rs.filter(function(r){return r.type==='expense'}).reduce(function(s,r){return s+Number(r.amount)},0);return inc-exp}catch(e){return 0}}
function bds(pct){if(pct>100)return'#D64545';if(pct>=80)return'#f5a623';if(pct>=60)return'#E8A838';return'#007AFF'}

function initDefs(){try{if(getCats().length===0){setItem('et_cats',[{id:'c001',name:'餐饮',emoji:'🍜',type:'expense',isCustom:false},{id:'c002',name:'交通',emoji:'🚗',type:'expense',isCustom:false},{id:'c003',name:'购物',emoji:'🛒',type:'expense',isCustom:false},{id:'c004',name:'娱乐',emoji:'🎮',type:'expense',isCustom:false},{id:'c005',name:'居住',emoji:'🏠',type:'expense',isCustom:false},{id:'c006',name:'医疗',emoji:'🏥',type:'expense',isCustom:false},{id:'c007',name:'教育',emoji:'📚',type:'expense',isCustom:false},{id:'c008',name:'通讯',emoji:'📱',type:'expense',isCustom:false},{id:'c009',name:'护肤',emoji:'💄',type:'expense',isCustom:false},{id:'c010',name:'旅游',emoji:'✈️',type:'expense',isCustom:false},{id:'c011',name:'运动健身',emoji:'💪',type:'expense',isCustom:false},{id:'c012',name:'宠物',emoji:'🐶',type:'expense',isCustom:false},{id:'c013',name:'社交',emoji:'🎁',type:'expense',isCustom:false},{id:'c014',name:'烟酒',emoji:'🚬',type:'expense',isCustom:false},{id:'c015',name:'投资',emoji:'📈',type:'expense',isCustom:false},{id:'c016',name:'汽车',emoji:'🚙',type:'expense',isCustom:false},{id:'c017',name:'母婴',emoji:'👶',type:'expense',isCustom:false},{id:'c018',name:'其他',emoji:'📌',type:'expense',isCustom:false},{id:'c101',name:'工资',emoji:'💼',type:'income',isCustom:false},{id:'c102',name:'兼职',emoji:'💻',type:'income',isCustom:false},{id:'c103',name:'投资理财',emoji:'📈',type:'income',isCustom:false},{id:'c104',name:'被动收入',emoji:'🏠',type:'income',isCustom:false},{id:'c105',name:'红包',emoji:'🧧',type:'income',isCustom:false},{id:'c106',name:'其他',emoji:'📌',type:'income',isCustom:false}])}if(getAccounts().length===0){setItem('et_accounts',[{id:'a001',name:'现金',icon:'💰',color:'#888'},{id:'a002',name:'支付宝',icon:'💳',color:'#1677ff'},{id:'a003',name:'微信支付',icon:'💳',color:'#07c160'},{id:'a004',name:'银行卡',icon:'🏦',color:'#722ed1'}])}}catch(e){}}

function renderLogin(){try{var lp=getItem('et_lastUser')||'';var h='<div class="auth-wrap"><div class="auth-box"><div class="auth-logo">💰</div><div class="auth-tit">记账本 V3</div><input type="tel" id="loginPhone" placeholder="手机号" maxlength="11" value="'+es(lp)+'" autocomplete="off"><input type="password" id="loginPwd" placeholder="密码（6位以上）" maxlength="20" autocomplete="off"><button class="auth-btn" onclick="doLogin()">登录</button><div class="auth-link" onclick="doRegister()">没有账号？点击注册</div></div></div>';P('app').innerHTML=h;P('app').className='app active'}catch(e){}}
function doLogin(){try{var ph=P('loginPhone').value.trim(),pw=P('loginPwd').value;if(!ph||!pw){toast('请输入手机号和密码');return}var users=getUsers();var u=users.find(function(x){return x.phone===ph&&x.password===pw});if(!u){toast('手机号或密码错误');return}curU=u;setItem('et_lastUser',ph);renderApp()}catch(e){toast('登录失败')}}
function doRegister(){try{var ph=P('loginPhone').value.trim(),pw=P('loginPwd').value;if(!ph||!pw){toast('请输入手机号和密码');return}if(pw.length<6){toast('密码至少6位');return}var users=getUsers();if(users.find(function(x){return x.phone===ph})){toast('该手机号已注册');return}var u={id:uid(),phone:ph,password:pw,created:Date.now()};users.push(u);setUsers(users);curU=u;setItem('et_lastUser',ph);renderApp()}catch(e){toast('注册失败')}}

function renderApp(){try{initDefs();var h='<div class="tab-bar">';h+=tabBtn('home','🏠','首页');h+=tabBtn('bills','📋','账单');h+=tabBtn('report','📊','报表');h+=tabBtn('my','👤','我的');h+='</div>';h+='<div class="page'+(curTab==='home'?' active':'')+'" id="pg-home"></div>';h+='<div class="page'+(curTab==='bills'?' active':'')+'" id="pg-bills"></div>';h+='<div class="page'+(curTab==='report'?' active':'')+'" id="pg-report"></div>';h+='<div class="page'+(curTab==='my'?' active':'')+'" id="pg-my"></div>';h+='<div class="fab" id="fab" onclick="openRecForm()">+</div>';P('app').innerHTML=h;P('app').className='app active';renderHome();renderBills();renderReport();renderMy()}catch(e){}}
function tabBtn(t,ic,lb){return'<div class="tab-btn'+(curTab===t?' active':'')+'" onclick="switchTab(\''+t+'\')"><span class="ic">'+ic+'</span>'+lb+'</div>'}

function switchTab(t){try{curTab=t;document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});var pg=P('pg-'+t);if(pg)pg.classList.add('active');document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});var btns=document.querySelectorAll('.tab-btn');var ts=['home','bills','report','my'];var i=ts.indexOf(t);if(i>=0&&btns[i])btns[i].classList.add('active');var f=P('fab');if(f)f.style.display=(t==='my')?'none':'flex';if(t=='home')renderHome();if(t=='bills')renderBills();if(t=='report')renderReport();if(t=='my')renderMy()}catch(e){}}
function refreshAll(){try{renderHome();renderBills();renderReport();renderMy()}catch(e){}}

function renderHome(){try{var mon=fmtM();var recs=myRecs().filter(function(r){return r.date&&r.date.substring(0,7)===mon});var inc=recs.filter(function(r){return r.type==='income'}).reduce(function(s,r){return s+Number(r.amount)},0);var exp=recs.filter(function(r){return r.type==='expense'}).reduce(function(s,r){return s+Number(r.amount)},0);var bud=getBudget().find(function(b){return b.user===curU.id});var bAmt=bud?Number(bud.amount):0;var pct=bAmt>0?Math.round(exp/bAmt*100):0;var color=bds(pct);var bal=inc-exp;var h='<div class="sc-row"><div class="sc inc"><div class="sc-lbl">本月收入</div><div class="sc-val inc">+'+fmtY(inc)+'</div></div><div class="sc exp"><div class="sc-lbl">本月支出</div><div class="sc-val exp">-'+fmtY(exp)+'</div></div><div class="sc bal"><div class="sc-lbl">结余</div><div class="sc-val bal" style="color:'+(bal>=0?'var(--accent)':'var(--red)')+'">'+(bal>=0?'+':'')+fmtY(bal)+'</div></div></div>';if(bAmt>0){var left=bAmt-exp;var lv=left>=0?'剩余 ¥'+fmtY(left):'超支 ¥'+fmtY(-left);h+='<div class="bd-card"><div class="bd-row"><span>已花 ¥'+fmtY(exp)+'</span><span>预算 ¥'+fmtY(bAmt)+'</span></div><div class="bd-bar"><div class="bd-fill" style="width:'+Math.min(pct,100)+'%;background:'+color+'"></div></div><div class="bd-pct" style="color:'+color+'">'+pct+'% '+lv+'</div></div>'}var recent=myRecs().sort(function(a,b){return(b.created||0)-(a.created||0)}).slice(0,5);h+='<div class="card"><div style="font-size:12px;color:var(--sub);margin-bottom:6px">最近记录</div>';if(recent.length===0){h+='<div class="empty"><p style="font-size:13px">暂无记录，点击右下角 + 记一笔</p></div>'}else{recent.forEach(function(r){h+=recHtml(r)})}h+='</div>';P('pg-home').innerHTML=h}catch(e){P('pg-home').innerHTML='<div class="empty"><p>加载失败</p></div>'}}
function recHtml(r,del){try{var c=catById(r.category);var ce=c?c.emoji:'📝';var cn=c?c.name:(r.category||'未知');var s=r.type==='income'?'+':'-';var cl=r.type==='income'?'inc':'exp';var a=accById(r.account);var asn=a?(a.icon+' '+a.name):'';var h='<div class="rec-row"'+(del?'':' onclick="openRecForm(\''+r.id+'\')"')+'><div class="rec-ic" style="background:'+(r.type==='income'?'#e8f0fd':'#ffebee')+'">'+ce+'</div><div class="rec-mid"><div class="cat">'+cn+'</div><div class="sub">'+(r.note||'')+(asn?' · '+asn:'')+'</div></div><div class="rec-right"><div class="rec-amt '+cl+'">'+s+r.amount+'</div><div class="rec-date">'+r.date+'</div></div></div>';return h}catch(e){return''}}

function renderBills(){try{var now=new Date();var today=fmtD(now);var sw=new Date(now);sw.setDate(now.getDate()-now.getDay());var mon=fmtM();var recs=myRecs().filter(function(r){if(bDate==='today'&&r.date!==today)return false;if(bDate==='week'){var rd=new Date(r.date);if(rd<sw)return false}if(bDate==='month'&&r.date.substring(0,7)!==mon)return false;if(bCat.length>0&&!bCat.includes(r.category))return false;if(bAcc.length>0&&!bAcc.includes(r.account))return false;if(bSearch){var c=catById(r.category);var cn=c?c.name:'';if(!(r.note||'').includes(bSearch)&&!cn.includes(bSearch)&&!(r.amount||'').includes(bSearch))return false}return true}).sort(function(a,b){return(b.created||0)-(a.created||0)});var h='<div class="sbox"><input type="text" placeholder="搜索备注/分类" value="'+es(bSearch)+'" oninput="bSearch=this.value;renderBills()"></div>';h+='<div class="f-row">';h+=chip('全部','',bDate==='');h+=chip('今天','today',bDate=='today');h+=chip('本周','week',bDate=='week');h+=chip('本月','month',bDate=='month');h+='</div>';h+='<div class="sub-row">';h+=schip('全部分类','',bCat.length===0,'cat');getCats().forEach(function(c){h+=schip(c.emoji+' '+c.name,c.id,bCat.includes(c.id),'cat')});h+='</div>';h+='<div class="sub-row">';h+=schip('全部账户','',bAcc.length===0,'acc');getAccounts().forEach(function(a){h+=schip(a.icon+' '+a.name,a.id,bAcc.includes(a.id),'acc')});h+='</div>';if(recs.length===0){h+='<div class="empty"><div class="eicon">📋</div><p>暂无记录</p></div>'}else{recs.forEach(function(r){h+='<div class="card" style="padding:10px 14px;margin-bottom:6px">'+recHtml(r,false)+'<div style="text-align:right;margin-top:4px"><span class="rec-del" onclick="delRec(\''+r.id+'\')">🗑 删除</span></div></div>'})}P('pg-bills').innerHTML=h}catch(e){P('pg-bills').innerHTML='<div class="empty"><p>加载失败</p></div>'}}
function chip(label,val,on){return'<div class="chip'+(on?' on':'')+'" onclick="bDate=\''+val+'\';renderBills()">'+label+'</div>'}
function schip(label,val,on,kind){var act="toggle"+kind.charAt(0).toUpperCase()+kind.slice(1)+"('"+val+"')";return'<div class="schip'+(on?' on':'')+'" onclick="'+act+'">'+label+'</div>'}
function toggleCat(id){if(!id){bCat=[]}else{var i=bCat.indexOf(id);if(i>=0)bCat.splice(i,1);else bCat.push(id)}renderBills()}
function toggleAcc(id){if(!id){bAcc=[]}else{var i=bAcc.indexOf(id);if(i>=0)bAcc.splice(i,1);else bAcc.push(id)}renderBills()}
function delRec(id){try{if(!confirm('确认删除？'))return;deleteRecord(id);refreshAll();toast('已删除')}catch(e){}}

var PCLR=['#007AFF','#E8A838','#D64545','#1677ff','#07c160','#f5a623','#7c3aed','#ec4899','#0ea5e9','#84cc16','#f97316','#007AFF'];
function drawConic(elId,recs,type){try{var el=P(elId);if(!el)return;var fil=recs.filter(function(r){return r.type===type});if(!fil.length){el.innerHTML='<div style="width:110px;height:110px;border-radius:50%;background:#eee;margin:0 auto"></div><div style="font-size:11px;color:var(--sub);margin-top:4px">暂无数据</div>';return}var g={};fil.forEach(function(r){var k=r.category||'_n_';g[k]=(g[k]||0)+Number(r.amount)});var ets=[];Object.keys(g).forEach(function(k){ets.push({cid:k,amt:g[k]})});ets.sort(function(a,b){return b.amt-a.amt});var tot=ets.reduce(function(s,e){return s+e.amt},0);var grads=[];var a=0;ets.forEach(function(e,i){var deg=e.amt/tot*360;grads.push(PCLR[i%PCLR.length]+' '+a.toFixed(2)+'deg '+(a+deg).toFixed(2)+'deg');a+=deg});var h='<div class="pie-can" style="background:conic-gradient('+grads.join(',')+')"><div class="pie-hole">¥'+Math.round(tot)+'</div></div>';h+='<div style="font-size:11px;color:var(--sub);margin-top:4px">合计 ¥'+fmtY(tot)+'</div><div class="pie-leg">';ets.forEach(function(e,i){var c=catById(e.cid);var n=c?c.name:(e.cid||'未知');var p=tot>0?(e.amt/tot*100).toFixed(1):'0';h+='<div class="leg-it"><span class="leg-d" style="background:'+PCLR[i%PCLR.length]+'"></span><span class="leg-n">'+n+'</span><span class="leg-v">'+p+'%</span></div>'});h+='</div>';el.innerHTML=h}catch(e){try{var x=P(elId);if(x)x.innerHTML=''}catch(e2){}}}

function renderReport(){try{var now=new Date();var today=fmtD(now);var mon=fmtM();if(!rptMonth)rptMonth=mon;var h='<div class="rpt-tog"><div class="tog-btn'+(rptType=='day'?' on':'')+'" onclick="rptType=\'day\';renderReport()">日报</div><div class="tog-btn'+(rptType=='month'?' on':'')+'" onclick="rptType=\'month\';renderReport()">月报</div></div>';var fil=myRecs();var lb;if(rptType=='day'){fil=fil.filter(function(r){return r.date===today});lb=today}else{fil=fil.filter(function(r){return r.date&&r.date.startsWith(rptMonth)});lb=rptMonth;h+='<div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px"><span style="cursor:pointer;font-size:18px" onclick="rptMonth=shiftMonth(rptMonth,-1);renderReport()">◀</span><span style="font-size:14px;font-weight:bold">'+lb+'</span><span style="cursor:pointer;font-size:18px" onclick="rptMonth=shiftMonth(rptMonth,1);renderReport()">▶</span></div>'}h+='<div class="pie-row"><div class="pie-col"><div class="pie-lbl">支出分布 ('+lb+')</div><div id="pie-exp"></div></div><div class="pie-col"><div class="pie-lbl">收入分布 ('+lb+')</div><div id="pie-inc"></div></div></div>';var tex=fil.filter(function(r){return r.type=='expense'}).reduce(function(s,r){return s+Number(r.amount)},0);var tin=fil.filter(function(r){return r.type=='income'}).reduce(function(s,r){return s+Number(r.amount)},0);h+='<div class="card" style="margin-top:10px"><div style="font-size:13px;font-weight:bold;margin-bottom:8px">汇总</div><div style="display:flex;justify-content:space-between;padding:5px 0"><span>支出</span><span style="color:var(--red);font-weight:bold">-¥'+fmtY(tex)+'</span></div><div style="display:flex;justify-content:space-between;padding:5px 0"><span>收入</span><span style="color:var(--accent);font-weight:bold">+¥'+fmtY(tin)+'</span></div><div style="display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid #eee;margin-top:4px;padding-top:9px"><span>结余</span><span style="font-weight:bold;color:'+(tin-tex>=0?'var(--accent)':'var(--red)')+'">¥'+fmtY(tin-tex)+'</span></div></div>';if(rptType=='month'&&fil.length>0){h+='<div class="card" style="margin-top:10px"><div style="font-size:13px;font-weight:bold;margin-bottom:8px">收支记录</div>';fil.sort(function(a,b){return(b.created||0)-(a.created||0)}).forEach(function(r){h+=recHtml(r)});h+='</div>'}P('pg-report').innerHTML=h;setTimeout(function(){drawConic('pie-exp',fil,'expense');drawConic('pie-inc',fil,'income')},60)}catch(e){P('pg-report').innerHTML='<div class="empty"><p>加载失败</p></div>'}}

function renderMy(){try{var bud=getBudget().find(function(b){return b.user===curU.id});var bAmt=bud?Number(bud.amount):0;var h='<div class="card"><div style="font-size:13px;font-weight:bold;margin-bottom:8px;display:flex;justify-content:space-between"><span>💰 账户管理</span><span style="font-size:12px;color:var(--accent);cursor:pointer" onclick="openAccForm()">+ 新增</span></div>';var as=getAccounts();as.forEach(function(a){var bl=accBal(a.id);h+='<div class="acc-row"><div class="acc-ic" style="background:'+a.color+'18;color:'+a.color+'">'+a.icon+'</div><div class="acc-mid"><div class="acc-name">'+a.name+'</div><div class="acc-bal">余额 ¥'+fmtY(bl)+'</div></div><span class="acc-ed" onclick="openAccForm(\''+a.id+'\')">编辑</span>'+(as.length>1?'<span class="acc-dl" onclick="doDelAcc(\''+a.id+'\')">删除</span>':'')+'</div>'});h+='</div><div class="card"><div style="font-size:13px;font-weight:bold;margin-bottom:8px;display:flex;justify-content:space-between"><span>🏷️ 分类管理</span><span style="font-size:12px;color:var(--accent);cursor:pointer" onclick="addCatPromptMy()">+ 新增</span></div>';var cs=getCats().filter(function(c){return c.isCustom});if(cs.length===0){h+='<div style="font-size:12px;color:var(--sub);padding:6px 0">暂无自定义分类</div>'}else{cs.forEach(function(c){h+='<div class="acc-row"><div class="acc-ic" style="background:'+(c.type==='expense'?'#ffebee':'#e8f0fd')+'">'+c.emoji+'</div><div class="acc-mid"><div class="acc-name">'+c.name+'</div><div class="acc-bal">'+(c.type==='expense'?'支出':'收入')+'</div></div><span class="acc-ed" onclick="editCatPrompt(\''+c.id+'\')">编辑</span><span class="acc-dl" onclick="doDelCat(\''+c.id+'\')">删除</span></div>'})}h+='</div><div class="card"><div style="font-size:13px;font-weight:bold;margin-bottom:8px">🎯 月度预算</div><div class="bd-form"><input type="number" id="budInput" placeholder="设置月度预算" value="'+(bAmt||'')+'" step="0.01" min="0"><button class="bd-save" onclick="doSaveBud()">保存</button></div></div><div class="card"><div class="set-item" onclick="doExport()"><div class="si-l"><span class="si-ic">📥</span><span class="si-tx">导出数据</span></div><span class="si-arr">›</span></div><div class="set-item" onclick="doImport()"><div class="si-l"><span class="si-ic">📤</span><span class="si-tx">导入数据</span></div><span class="si-arr">›</span></div></div><div class="card"><div class="set-item" onclick="doLogout()"><div class="si-l"><span class="si-ic">🚪</span><span class="si-tx" style="color:var(--red)">退出登录</span></div><span class="si-arr">›</span></div></div><div style="text-align:center;padding:12px;font-size:11px;color:var(--sub)">记账本 V3 · 数据存储在本地浏览器</div>';P('pg-my').innerHTML=h}catch(e){P('pg-my').innerHTML='<div class="empty"><p>加载失败</p></div>'}}

function doSaveBud(){try{var v=Number(P('budInput').value);if(!v||v<=0){toast('请输入有效金额');return}saveBudget({user:curU.id,amount:v});toast('预算已保存');renderHome();renderMy()}catch(e){toast('保存失败')}}
function doExport(){try{var d={records:myRecs(),cats:getCats().filter(function(c){return c.isCustom}),accounts:getAccounts(),budget:getBudget().filter(function(b){return b.user===curU.id})};var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='expense-backup-'+fmtD(new Date())+'.json';a.click();URL.revokeObjectURL(a.href);toast('导出成功')}catch(e){toast('导出失败')}}
function doImport(){try{var inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=function(e){try{var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{var d=JSON.parse(ev.target.result);if(d.records){var ex=getRecords();d.records.forEach(function(r){if(r.user!==curU.id)r.user=curU.id;if(!ex.find(function(x){return x.id===r.id}))ex.unshift(r)});setItem('et_records',ex)}if(d.cats){var cs=getCats();d.cats.forEach(function(c){if(!cs.find(function(x){return x.id===c.id}))cs.push(c)});setItem('et_cats',cs)}if(d.accounts){var as=getAccounts();d.accounts.forEach(function(a){if(!as.find(function(x){return x.id===a.id}))as.push(a)});setItem('et_accounts',as)}if(d.budget){d.budget.forEach(function(b){saveBudget(b)})}toast('导入成功');refreshAll()}catch(err){toast('文件格式错误')}};r.readAsText(f)}catch(err2){}};inp.click()}catch(e){toast('导入失败')}}
function doLogout(){try{if(!confirm('确定退出登录？'))return;curU=null;setItem('et_lastUser','');renderLogin()}catch(e){}}

function openAccForm(id){try{editAcc=id||null;var a=id?getAccounts().find(function(x){return x.id===id}):null;var h='<div class="modal show" id="accMod" onclick="closeAccMod(event)"><div onclick="event.stopPropagation()"><div class="m-hd">'+(a?'编辑账户':'新增账户')+'</div><div class="fg"><label>图标</label><input id="accIc" value="'+(a?a.icon:'💰')+'" placeholder="emoji图标"></div><div class="fg"><label>名称</label><input id="accNm" value="'+(a?a.name:'')+'" placeholder="账户名称"></div><div class="fg"><label>颜色</label><input id="accCl" value="'+(a?a.color:'#1677ff')+'" placeholder="#1677ff"></div><button class="btn-save" onclick="doSaveAcc()">保存</button></div></div>';var o=P('accMod');if(o)o.remove();P('app').insertAdjacentHTML('beforeend',h)}catch(e){}}
function closeAccMod(e){try{if(e&&e.target!==P('accMod'))return;var m=P('accMod');if(m)m.remove();editAcc=null}catch(e){}}
function doSaveAcc(){try{var ic=P('accIc').value.trim()||'💰';var nm=P('accNm').value.trim();var cl=P('accCl').value.trim()||'#1677ff';if(!nm){toast('请输入账户名称');return}if(editAcc){var as=getAccounts();var a=as.find(function(x){return x.id===editAcc});if(a){a.icon=ic;a.name=nm;a.color=cl;saveAccount(a)}}else{saveAccount({id:uid(),icon:ic,name:nm,color:cl})}closeAccMod(null);renderMy();toast('账户已保存')}catch(e){toast('保存失败')}}
function doDelAcc(id){try{var as=getAccounts();if(as.length<=1){toast('至少保留一个账户');return}if(!confirm('确认删除该账户？'))return;deleteAccount(id);renderMy();toast('已删除')}catch(e){}}

function openRecForm(id){try{editId=id||null;var r=id?getRecords().find(function(x){return x.id===id}):null;if(r){fType=r.type;fCat=r.category;fDate=r.date;fAcc=r.account;fAmt=r.amount}else{var lc=getLastCombo();if(lc){fType=lc.type||'expense';fCat=lc.category||'';fAcc=lc.account||(getAccounts().length>0?getAccounts()[0].id:'');fDate=fmtD(new Date());fAmt=''}else{fType='expense';fCat='';fDate=fmtD(new Date());fAcc=getAccounts().length>0?getAccounts()[0].id:'';fAmt=''}}var h='<div class="modal show" id="recMod" onclick="closeRecMod(event)"><div onclick="event.stopPropagation()" style="max-height:90vh;overflow-y:auto"><div class="m-hd">'+(r?'编辑记录':'记一笔')+'</div><div class="ty-row"><div class="ty-btn'+(fType==='expense'?' ex-sel':'')+'" onclick="fType=\'expense\';renderFBody()">支出</div><div class="ty-btn'+(fType==='income'?' in-sel':'')+'" onclick="fType=\'income\';renderFBody()">收入</div></div><div id="fBody"></div></div></div>';var o=P('recMod');if(o)o.remove();P('app').insertAdjacentHTML('beforeend',h);renderFBody()}catch(e){toast('打开失败')}}
function closeRecMod(e){try{if(e&&e.target!==P('recMod'))return;var m=P('recMod');if(m)m.remove();editId=null}catch(e){}}

function renderFBody(){try{var h='<div class="fg"><label>金额</label><div class="amt-wrap"><input type="number" id="fAmtInp" value="'+es(fAmt)+'" step="0.01" min="0.01" placeholder="0.00" oninput="fAmt=this.value"><div class="qbtns"><span class="qbtn" onclick="addAmt(100)">x100</span><span class="qbtn" onclick="addAmt(1000)">x1000</span><span class="qbtn" onclick="addAmt(10000)">x10000</span></div></div></div>';var lu=getLastUsed();if(lu.length>0){h+='<div class="fg"><label>最近使用</label><div class="recent-r">';lu.forEach(function(cid){var c=catById(cid);if(c&&c.type===fType)h+='<div class="rc-it" style="'+(fCat===cid?'border-color:var(--accent);background:#e8f0fd':'')+'" onclick="fCat=\''+cid+'\';renderFBody()"><span class="rc-ic">'+c.emoji+'</span>'+c.name+'</div>'});h+='</div></div>'}var cats=getCats().filter(function(c){return c.type===fType});h+='<div class="fg"><label>分类</label><div class="cat-m">';cats.forEach(function(c){h+='<div class="ci'+(fCat===c.id?' sel':'')+'" onclick="fCat=\''+c.id+'\';renderFBody()"><span class="ci-ic">'+c.emoji+'</span><span class="ci-nm">'+c.name+'</span></div>'});h+='<div class="ci add" onclick="addCatPrompt()"><span class="ci-ic">+</span><span class="ci-nm">自定义</span></div></div></div>';var as=getAccounts();h+='<div class="fg"><label>账户</label><select id="fAccSel" onchange="fAcc=this.value" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:#fafafa">';as.forEach(function(a){h+='<option value="'+a.id+'"'+(fAcc===a.id?' selected':'')+'>'+a.icon+' '+a.name+'</option>'});h+='</select></div>';var td=fmtD(new Date()),yd=fmtD(new Date(Date.now()-86400000));h+='<div class="fg"><label>日期</label><div class="date-chips"><span class="dchip'+(fDate===td?' on':'')+'" onclick="fDate=\''+td+'\';renderFBody()">今天</span><span class="dchip'+(fDate===yd?' on':'')+'" onclick="fDate=\''+yd+'\';renderFBody()">昨天</span></div><input type="date" id="fDateInp" value="'+fDate+'" onchange="fDate=this.value" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:#fafafa"></div>';var note=editId?((getRecords().find(function(x){return x.id===editId})||{}).note||''):'';h+='<div class="fg"><label>备注</label><input id="fNoteInp" value="'+es(note)+'" placeholder="添加备注" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:#fafafa"></div>';h+='<button class="btn-save" onclick="doSaveRec()">保存</button>';if(editId)h+='<button class="btn-save danger" onclick="doDelRecInForm()">删除此记录</button>';P('fBody').innerHTML=h;var tyRow=P('recMod')&&P('recMod').querySelector('.ty-row');if(tyRow){var btns=tyRow.querySelectorAll('.ty-btn');if(btns[0])btns[0].className='ty-btn'+(fType==='expense'?' ex-sel':'');if(btns[1])btns[1].className='ty-btn'+(fType==='income'?' in-sel':'')}}catch(e){}}
function addAmt(n){try{var v=parseFloat(fAmt)||0;fAmt=String(v*n);var inp=P('fAmtInp');if(inp)inp.value=fAmt}catch(e){}}
function addCatPrompt(){try{var t=fType||'expense';var n=prompt('输入自定义分类名称：');if(!n||!n.trim())return;var e=prompt('输入emoji图标：','📝');if(!e)e='📝';saveCat({id:uid(),name:n.trim(),emoji:e,type:t,isCustom:true});renderFBody();renderMy()}catch(e){}}
function editCatPrompt(id){try{var c=catById(id);if(!c)return;var n=prompt('编辑分类名称：',c.name);if(!n||!n.trim())return;var e=prompt('编辑emoji图标：',c.emoji);if(!e)e=c.emoji;c.name=n.trim();c.emoji=e;saveCat(c);renderMy();refreshAll();toast('分类已更新')}catch(e){}}
function addCatPromptMy(){try{var t=confirm('点击「确定」添加支出分类，点击「取消」添加收入分类');var ty=t?'expense':'income';var n=prompt('输入自定义分类名称：');if(!n||!n.trim())return;var e=prompt('输入emoji图标：','📝');if(!e)e='📝';saveCat({id:uid(),name:n.trim(),emoji:e,type:ty,isCustom:true});renderMy();refreshAll();toast('分类已添加')}catch(e){}}
function doDelCat(id){try{if(!confirm('确认删除该分类？'))return;deleteCat(id);renderMy();refreshAll();toast('分类已删除')}catch(e){}}
function doSaveRec(){try{var amt=parseFloat(P('fAmtInp').value);if(isNaN(amt)||amt<=0){toast('请输入有效金额');return}if(!fCat){toast('请选择分类');return}fAcc=P('fAccSel').value;fDate=P('fDateInp').value;var note=P('fNoteInp').value.trim();var rec;if(editId){rec=getRecords().find(function(x){return x.id===editId});if(!rec){toast('记录不存在');return};rec.amount=amt.toFixed(2);rec.type=fType;rec.category=fCat;rec.account=fAcc;rec.date=fDate;rec.note=note}else{rec={id:uid(),amount:amt.toFixed(2),type:fType,category:fCat,account:fAcc,date:fDate,note:note,user:curU.id,created:Date.now()}}saveRecord(rec);setLastUsed(fCat);setLastCombo({type:fType,category:fCat,account:fAcc});closeRecMod(null);var mon=fmtM();var ms=myRecs().filter(function(r){return r.date&&r.date.startsWith(mon)});var ex=ms.filter(function(r){return r.type==='expense'}).reduce(function(s,r){return s+Number(r.amount)},0);var bud=getBudget().find(function(b){return b.user===curU.id});var ba=bud?Number(bud.amount):0;if(ba>0){var lf=ba-ex;var pct=Math.round(ex/ba*100);var al=getAlerted();var ak=mon+'_'+curU.id;if(pct>=100&&!al[ak+'_100']){setTimeout(function(){alert('本月支出已超出预算！\\n已花 ¥'+fmtY(ex)+'\\n预算 ¥'+fmtY(ba))},200);al[ak+'_100']=true;setItem('et_alerted',al)}else if(pct>=80&&!al[ak+'_80']){setTimeout(function(){alert('本月支出已达预算80%！\\n已花 ¥'+fmtY(ex)+'\\n剩余 ¥'+fmtY(Math.max(0,lf)))},200);al[ak+'_80']=true;setItem('et_alerted',al)}toast('本月已花 ¥'+fmtY(ex)+'，还剩 ¥'+(lf>0?fmtY(lf):'0.00'))}else{toast('记账成功！本月支出 ¥'+fmtY(ex))}refreshAll()}catch(e){toast('保存失败')}}
function doDelRecInForm(){try{if(!editId)return;if(!confirm('确认删除？'))return;deleteRecord(editId);closeRecMod(null);refreshAll();toast('已删除')}catch(e){}}

var lp=getItem('et_lastUser');
if(lp){var us=getUsers();var u=us.find(function(x){return x.phone===lp});if(u){curU=u;renderApp()}else{renderLogin()}}
else{renderLogin()}
</script>
</body>
